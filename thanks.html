<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Jen Leigh Photography</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#faf8f4;--ink:#1c1a17;--muted:#8a8378;--line:#e7e2d8;--accent:#9a8c74;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;text-align:center;padding:40px}
  .k{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(2.2rem,5vw,3.4rem);margin:0 0 18px;line-height:1.1}
  h1 em{font-style:italic;color:var(--accent)}
  p{color:#5b554c;font-size:1.02rem;max-width:46ch;margin:0 0 32px;line-height:1.6}
  a.btn{display:inline-block;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--ink);
    padding:14px 30px;color:inherit;text-decoration:none;transition:all .25s}
  a.btn:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
  <div class="k">Inquiry received</div>
  <h1>Thank you, it's <em>on its way</em>.</h1>
  <p>Your message just landed in my inbox. I read every inquiry personally and will get back to you within a couple of days. I can't wait to hear more about your day.</p>
  <a class="btn" href="index.html">Back to the portfolio</a>
</body>
</html>
